<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mom's Little Journey</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FBF5EE;
      color: #4A3B36;
    }

    .loading {
      text-align: center;
      padding: 24px;
    }

    .flower {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .text {
      font-size: 18px;
    }
  </style>

  <script>
    (function () {
      var BASE_PATH = "/momjourney/";

      var requestedPath =
        location.pathname +
        location.search +
        location.hash;

      sessionStorage.setItem(
        "momjourney-redirect",
        requestedPath
      );

      location.replace(
        location.origin + BASE_PATH
      );
    })();
  </script>
</head>

<body>
  <div class="loading">
    <div class="flower">🌷</div>
    <div class="text">
      Taking you to Mom's little journey…
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom's Little Journey</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#FBF5EE; color:#4A3B36;
  }
</style>
<!-- =========================================================
     Some static hosts (GitHub Pages, and any plain file server
     with no rewrite rules) can't route /mom/5 to index.html on
     their own. They DO serve this file for unknown paths though,
     so we stash the intended path and redirect to index.html,
     which restores it on load. This makes direct deep links work
     even with zero server configuration.
     ========================================================= */
<script>
  sessionStorage.setItem('momjourney-redirect', location.pathname + location.search + location.hash);
  location.replace('/');
</script>
</head>
<body>
  <p>Taking you to the journey… 🌷</p>
</body>
</html>

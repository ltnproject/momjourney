<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mom's Little Journey</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #FBF5EE;
      color: #4A3B36;
    }

    .loading {
      text-align: center;
      padding: 24px;
    }

    .flower {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .text {
      font-size: 18px;
    }
  </style>

  <script>
    /*
     * =========================================================
     * MOM'S LITTLE JOURNEY — 404 HANDLER
     * =========================================================
     *
     * This file is used when someone opens a URL such as:
     *
     *   /momjourney/mom/1
     *   /momjourney/mom/2
     *   /momjourney/mom/3
     *
     * GitHub Pages doesn't know those routes exist, so it serves
     * this 404.html instead.
     *
     * We:
     *
     * 1. Save the original URL.
     * 2. Send the visitor to /momjourney/
     * 3. The main app can then restore the saved URL.
     *
     * =========================================================
     */

    const BASE_PATH = "/momjourney/";

    /*
     * Build the exact URL the visitor originally requested.
     */
    const originalPath =
      window.location.pathname +
      window.location.search +
      window.location.hash;

    /*
     * Store it temporarily.
     */
    sessionStorage.setItem(
      "momjourney-redirect",
      originalPath
    );

    /*
     * Build the base URL using the current domain.
     *
     * Example:
     *
     * https://drk.qzz.io/momjourney/
     */
    const baseURL =
      window.location.origin + BASE_PATH;

    /*
     * Prevent a pointless redirect if somehow the 404 page
     * is already being served at the base path.
     */
    if (window.location.pathname !== BASE_PATH) {
      window.location.replace(baseURL);
    }
  </script>
</head>

<body>

  <div class="loading">

    <div class="flower">
      🌷
    </div>

    <div class="text">
      Taking you to Mom's little journey…
    </div>

  </div>

</body>
</html>
